name: Build Windows installer

on:
  push:
    branches: ["**"]
    tags: ["v*"]
  pull_request:
  workflow_dispatch:

env:
  PYTHON_VERSION: "3.12"

jobs:
  test:
    name: Tests (Linux)
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: ${{ env.PYTHON_VERSION }}
          cache: pip
      - name: Install dependencies
        run: |
          python -m pip install --upgrade pip
          pip install -r requirements-dev.txt
      - name: Run tests
        run: python -m pytest tests/ -q

  build:
    name: Build installer (Windows)
    runs-on: windows-latest
    needs: test
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-python@v5
        with:
          python-version: ${{ env.PYTHON_VERSION }}
          cache: pip

      - name: Install dependencies
        run: |
          python -m pip install --upgrade pip
          pip install -r requirements-dev.txt
          pip install pyinstaller==6.11.1

      - name: Read version
        id: version
        shell: bash
        run: |
          version=$(python -c "import re,pathlib; print(re.search(r'__version__ = \"([^\"]+)\"', pathlib.Path('src/eggmate/__init__.py').read_text()).group(1))")
          echo "version=$version" >> "$GITHUB_OUTPUT"
          echo "Building version $version"

      - name: Run tests on Windows
        run: python -m pytest tests/ -q
        env:
          PYTHONPATH: src

      - name: Generate icon
        run: python packaging/make_icon.py src/eggmate/data/icon.ico
        env:
          PYTHONPATH: src
          QT_QPA_PLATFORM: offscreen

      - name: Smoke test the GUI
        run: python packaging/smoke_test.py
        env:
          PYTHONPATH: src
          QT_QPA_PLATFORM: offscreen

      - name: Build with PyInstaller
        run: pyinstaller --noconfirm --clean packaging/eggmate.spec

      - name: Verify the built exe starts
        run: python packaging/verify_build.py dist/EggMate/EggMate.exe

      - name: Install Inno Setup
        run: choco install innosetup --no-progress -y

      - name: Build installer
        run: |
          & "C:\Program Files (x86)\Inno Setup 6\ISCC.exe" /DAppVersion=${{ steps.version.outputs.version }} packaging\installer.iss

      - name: Upload installer
        uses: actions/upload-artifact@v4
        with:
          name: EggMate-${{ steps.version.outputs.version }}-Setup
          path: dist/EggMate-${{ steps.version.outputs.version }}-Setup.exe
          if-no-files-found: error

      - name: Upload portable build
        uses: actions/upload-artifact@v4
        with:
          name: EggMate-${{ steps.version.outputs.version }}-portable
          path: dist/EggMate/
          if-no-files-found: error

      - name: Attach installer to release
        if: startsWith(github.ref, 'refs/tags/v')
        uses: softprops/action-gh-release@v2
        with:
          files: dist/EggMate-${{ steps.version.outputs.version }}-Setup.exe
          generate_release_notes: true
