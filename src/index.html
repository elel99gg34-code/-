<!doctype html>
<html lang="en">
<head>
<meta charset="utf-8">
<meta http-equiv="Content-Security-Policy"
      content="default-src 'none'; script-src 'self'; style-src 'self' 'unsafe-inline'; img-src 'self' data:; media-src 'self' blob: data:; connect-src 'self' blob: data:; font-src 'self';">
<title>RIOT MACHINE</title>
<link rel="stylesheet" href="/css/app.css">
</head>
<body>

<div id="splash">
  <div class="logo">
    <div class="mark"></div>
    <h1>RIOT MACHINE</h1>
    <p>booting the rack</p>
  </div>
</div>

<div id="app">

  <!-- ============ TITLE BAR ============ -->
  <div id="titlebar">
    <div class="brand"><div class="mark"></div><b>RIOT</b><span>MACHINE</span></div>
    <div class="doc">
      <div class="name" id="docname" title="Click to rename">Untitled Riot</div>
      <div class="dirty hide" id="dirty" title="Unsaved changes">•</div>
    </div>
    <div class="wincontrols">
      <button id="win-min" title="Minimize"><svg viewBox="0 0 10 10"><rect x="0" y="4.5" width="10" height="1" fill="currentColor"/></svg></button>
      <button id="win-max" title="Maximize"><svg viewBox="0 0 10 10"><rect x="0.5" y="0.5" width="9" height="9" fill="none" stroke="currentColor"/></svg></button>
      <button id="win-close" class="close" title="Close"><svg viewBox="0 0 10 10"><path d="M0 0 L10 10 M10 0 L0 10" stroke="currentColor" fill="none"/></svg></button>
    </div>
  </div>

  <!-- ============ TRANSPORT ============ -->
  <div id="transport">
    <div class="tgroup">
      <button class="tbtn big play" id="t-play" title="Play / Stop (Space)">
        <svg viewBox="0 0 16 16"><path d="M3 2 L13 8 L3 14 Z"/></svg>
      </button>
      <button class="tbtn big" id="t-stop" title="Stop (Esc)">
        <svg viewBox="0 0 16 16"><rect x="3" y="3" width="10" height="10"/></svg>
      </button>
      <button class="tbtn" id="t-song" title="Song mode (Ctrl+L)">SONG</button>
      <button class="tbtn" id="t-metro" title="Metronome (Ctrl+M)">
        <svg viewBox="0 0 16 16"><path d="M8 1 L12 14 H4 Z M2 14 H14" fill="none" stroke="currentColor" stroke-width="1.4"/></svg>
      </button>
    </div>

    <div class="tsep"></div>

    <div id="clock" class="mono" title="Bar · Beat · Step">001<small>:</small>1<small>:</small>01</div>

    <div class="tgroup">
      <div class="field">
        <label>Tempo</label>
        <div class="numbox" id="t-bpm" title="Drag or double-click to set BPM">150</div>
      </div>
      <div class="field">
        <label>Swing</label>
        <div class="numbox sm" id="t-swing" title="Drag to set swing">0%</div>
      </div>
      <button class="tbtn" id="t-tap" title="Tap tempo (Ctrl+T)">TAP</button>
    </div>

    <div class="tsep"></div>

    <div class="tgroup">
      <div class="field">
        <label>Steps / beat</label>
        <select class="input" id="t-res" style="height:26px;width:74px">
          <option value="2">1/8</option>
          <option value="3">1/8T</option>
          <option value="4" selected>1/16</option>
          <option value="6">1/16T</option>
          <option value="8">1/32</option>
        </select>
      </div>
      <div class="field">
        <label>Key</label>
        <div style="display:flex;gap:3px">
          <select class="input" id="t-root" style="height:26px;width:56px"></select>
          <select class="input" id="t-scale" style="height:26px;width:98px"></select>
        </div>
      </div>
    </div>

    <div class="masterzone">
      <button class="btn" id="t-export" title="Export audio (Ctrl+E)">
        <svg viewBox="0 0 16 16" fill="none" stroke="currentColor" stroke-width="1.5"><path d="M8 1v9M4.5 6.5L8 10l3.5-3.5M2 13h12"/></svg>
        EXPORT
      </button>
      <button class="btn" id="t-save" title="Save to vault (Ctrl+S)">
        <svg viewBox="0 0 16 16" fill="none" stroke="currentColor" stroke-width="1.5"><path d="M2 2h9l3 3v9H2z"/><path d="M5 2v4h6V2M5 14v-5h6v5"/></svg>
        SAVE
      </button>
      <div class="field">
        <label>Master</label>
        <div class="meter" title="Master output level"><i id="masterlevel"></i></div>
      </div>
    </div>
  </div>

  <!-- ============ BODY ============ -->
  <div id="body">
    <nav id="nav">
      <button data-view="studio" class="on" title="Studio (F2)">
        <svg viewBox="0 0 20 20"><rect x="2" y="3" width="16" height="14" rx="1"/><path d="M2 8h16M7 8v9M12 8v9"/></svg>
        Studio
      </button>
      <button data-view="rack" title="Instruments (F3)">
        <svg viewBox="0 0 20 20"><rect x="2" y="2" width="16" height="7" rx="1"/><rect x="2" y="11" width="16" height="7" rx="1"/><path d="M5 5.5h3M5 14.5h3"/></svg>
        Rack
      </button>
      <button data-view="mixer" title="Mixer (F4)">
        <svg viewBox="0 0 20 20"><path d="M5 2v16M10 2v16M15 2v16"/><rect x="3" y="6" width="4" height="3" rx="1"/><rect x="8" y="11" width="4" height="3" rx="1"/><rect x="13" y="4" width="4" height="3" rx="1"/></svg>
        Mixer
      </button>
      <button data-view="song" title="Arrangement (F6)">
        <svg viewBox="0 0 20 20"><rect x="2" y="4" width="5" height="5" rx="1"/><rect x="9" y="4" width="9" height="5" rx="1"/><rect x="2" y="11" width="9" height="5" rx="1"/><rect x="13" y="11" width="5" height="5" rx="1"/></svg>
        Song
      </button>
      <button data-view="vault" title="Vault (F7)">
        <svg viewBox="0 0 20 20"><rect x="2" y="3" width="16" height="14" rx="1"/><circle cx="10" cy="10" r="3.5"/><path d="M10 3v3M10 14v3"/></svg>
        Vault
      </button>
      <div class="spacer"></div>
      <button id="nav-help" title="Shortcuts (F1)">
        <svg viewBox="0 0 20 20"><circle cx="10" cy="10" r="8"/><path d="M7.7 7.5a2.3 2.3 0 114 1.6c-.9.8-1.7 1.2-1.7 2.4"/><circle cx="10" cy="15" r=".6" fill="currentColor"/></svg>
        Help
      </button>
    </nav>

    <div id="main">
      <!-- STUDIO -->
      <section class="view on" id="studio">
        <div id="tracklist">
          <div class="panelhead">
            <h2>Tracks</h2><div class="grow"></div>
            <button class="btn sm" id="add-track">+ TRACK</button>
          </div>
          <div class="rows" id="trackrows"></div>
        </div>

        <div id="gridwrap">
          <div id="gridtoolbar">
            <div class="patchips" id="patchips"></div>
            <button class="btn sm" id="pat-add" title="New pattern">+</button>
            <button class="btn sm" id="pat-dup" title="Duplicate pattern (Ctrl+D)">DUP</button>
            <button class="btn sm" id="pat-len" title="Pattern length">16 STEPS</button>
            <div class="grow" style="flex:1"></div>
            <button class="btn sm" id="mode-grid">GRID</button>
            <button class="btn sm" id="mode-roll">PIANO ROLL</button>
            <button class="btn sm" id="edit-clear" title="Clear this track in this pattern">CLEAR</button>
            <button class="btn sm" id="edit-fill">FILL</button>
            <button class="btn sm" id="edit-rand">RANDOM</button>
          </div>
          <div id="gridscroll"></div>
        </div>

        <aside id="inspector">
          <div class="panelhead"><h2 id="insp-title">Instrument</h2><div class="grow"></div>
            <button class="btn sm" id="insp-audition" title="Audition">▶</button>
          </div>
          <div class="scroll" id="insp-body"></div>
        </aside>
      </section>

      <!-- RACK -->
      <section class="view" id="rack">
        <div id="rackcats">
          <div class="panelhead"><h2>Categories</h2></div>
          <div class="list" id="catlist"></div>
        </div>
        <div id="rackmain">
          <div class="panelhead">
            <h2>The Rack</h2>
            <div class="sub" id="rackcount">260 instruments</div>
            <div class="grow"></div>
            <input class="input" id="racksearch" placeholder="Search instruments, tags…" style="width:220px">
            <button class="btn sm" id="rack-add" title="Add selected instrument as a new track">+ ADD AS TRACK</button>
            <button class="btn sm" id="rack-export" title="Render the selected instrument to a WAV file">EXPORT WAV</button>
          </div>
          <div id="rackgrid"></div>
        </div>
      </section>

      <!-- MIXER -->
      <section class="view" id="mixer">
        <div class="panelhead"><h2>Mixer</h2><div class="sub" id="mixsub"></div><div class="grow"></div>
          <button class="btn sm" id="mix-reset">RESET FADERS</button>
        </div>
        <div id="mixerstrips"></div>
      </section>

      <!-- SONG -->
      <section class="view" id="song">
        <div class="panelhead"><h2>Arrangement</h2><div class="sub" id="songsub"></div><div class="grow"></div>
          <button class="btn sm" id="song-clear">CLEAR</button>
          <button class="btn sm" id="song-auto">BUILD FROM PATTERNS</button>
        </div>
        <div id="songwrap"><div class="songlane" id="songlane"></div></div>
      </section>

      <!-- VAULT -->
      <section class="view" id="vault">
        <div class="panelhead"><h2>Project Vault</h2><div class="sub" id="vaultsub"></div><div class="grow"></div>
          <button class="btn sm" id="vault-new">+ NEW</button>
          <button class="btn sm" id="vault-import">IMPORT .RIOT</button>
          <button class="btn sm" id="vault-folder">OPEN FOLDER</button>
          <button class="btn sm" id="vault-refresh">REFRESH</button>
        </div>
        <div id="vaultlist"></div>
      </section>
    </div>
  </div>
</div>

<div id="scrim"><div class="modal" id="modal"></div></div>
<div id="toasts"></div>

<script type="module" src="/js/app.js"></script>
</body>
</html>
